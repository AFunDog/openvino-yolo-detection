[project]
name = "openvino-yolo-detection"
version = "0.1.0"
description = "YOLO 智能交通灯控制系统 — 基于 YOLOv26 目标检测 + Vehicle-Actuated 交通灯控制 + SUMO 微观仿真"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "OpenVINO YOLO Detection Project" }
]
keywords = ["openvino", "yolo", "object-detection", "deep-learning", "traffic-light", "sumo", "vehicle-actuated"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openvino>=2024.6.0",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "onnxruntime<1.20",
    "yt-dlp>=2026.3.17",
    "PyQt6>=6.5.0",
    "ultralytics>=8.4.42",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "black",
    "ruff",
    "openvino-dev",
    "onnx",
    "ultralytics",
]
sumo = [
    "traci>=1.27.0",
]

[project.scripts]
yolo-detect = "main:run_cli"

[project.urls]
Homepage = "https://github.com/your-repo/openvino-yolo-detection"
Repository = "https://github.com/your-repo/openvino-yolo-detection"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
